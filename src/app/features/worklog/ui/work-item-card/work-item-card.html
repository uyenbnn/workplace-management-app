<button
  type="button"
  class="item-card"
  [class.meeting]="item().type === 'MEETING'"
  [class.task]="item().type === 'WORK_ON_TASK'"
  [class.time-logged]="item().timeLog"
  (click)="$event.stopPropagation(); choose.emit(item().id)"
>
  <span class="item-title" [title]="title()">{{ title() }}</span
  ><span class="item-meta item-details">
    <span>{{ hours() }} h</span>
    @if (taskStatus(); as taskStatus) {
      <span
        class="status-badge"
        [class.done]="taskStatus === 'DONE'"
        [class.in-progress]="taskStatus === 'IN_PROGRESS'"
        >{{ status() }}</span
      >
    } @else {
      <span>· {{ status() }}</span>
    }</span
  ><span class="item-meta" [class.logged]="item().timeLog">
    @if (item().timeLog) {
      <span class="material-symbols-outlined" aria-hidden="true">check</span>
    }
    {{ item().timeLog ? 'Logged' : 'Not logged' }}</span
  >
</button>
